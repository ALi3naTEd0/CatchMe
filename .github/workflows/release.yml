name: Release

# Builds the installable app for Linux, Windows and macOS, tests each package
# on a clean machine of that system (install, start, connect to the engine,
# screenshot, close, check the engine stopped), and on a v* tag publishes a
# GitHub Release. Run it by hand (Actions > Release > Run workflow) to get
# the packages and screenshots without publishing anything.

on:
  push:
    tags: ['v*']
    # While the rewrite lives on go-rewrite, build and test packages on every
    # push there too (workflow_dispatch only works from the default branch).
    branches: [go-rewrite]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v="${GITHUB_REF_NAME#v}"
          else v="$(packaging/version.sh)-ci.$GITHUB_RUN_NUMBER"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Building $v"

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: catchmed/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb imagemagick
      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build packages
        if: runner.os != 'Windows'
        run: packaging/${{ runner.os == 'Linux' && 'linux' || 'macos' }}/build.sh
      - name: Build packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging\windows\build.ps1

      - name: Test the package on a clean machine
        if: runner.os == 'Linux'
        run: packaging/linux/smoke.sh "dist/CatchMe-$VERSION-x86_64.AppImage" dist
      - name: Test the package on a clean machine
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging\windows\smoke.ps1 "dist\CatchMe-$env:VERSION-windows-x64-setup.exe" dist
      - name: Test the package on a clean machine
        if: runner.os == 'macOS'
        run: packaging/macos/smoke.sh "dist/CatchMe-$VERSION-macos.dmg" dist

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: catchme-${{ runner.os }}
          path: |
            dist/CatchMe-*
          if-no-files-found: error
      - name: Upload screenshot and smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ runner.os }}
          path: |
            dist/screenshot-*.png
            dist/smoke-*
          if-no-files-found: ignore

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: catchme-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum CatchMe-* > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "CatchMe ${GITHUB_REF_NAME#v}" --generate-notes \
            ${{ contains(github.ref_name, '-') && '--prerelease' || '' }} \
            CatchMe-* SHA256SUMS.txt
